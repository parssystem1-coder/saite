# به‌روزرسانی خودکار وابستگی‌ها.
#
# ── چرا لازم است ──────────────────────────────────────────────
# پروژه ۳۰ وابستگی مستقیم دارد و هیچ‌کدام پایش نمی‌شوند. آسیب‌پذیری
# در یک پکیج فرعی (مثل همان CVE-2025-29927 در خود Next) تا وقتی
# کسی دستی چک نکند نامرئی است.
#
# ── چرا گروه‌بندی؟ ────────────────────────────────────────────
# بدون گروه، Dependabot هفته‌ای ۱۵ PR باز می‌کند و بعد از دو هفته
# همه را نادیده می‌گیرید — که بدتر از نداشتنش است.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      # هستهٔ فریم‌ورک: با هم بالا می‌روند وگرنه ناسازگاری می‌گیرید
      next-core:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
          - "@types/react*"
      tiptap:
        patterns:
          - "@tiptap/*"
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
