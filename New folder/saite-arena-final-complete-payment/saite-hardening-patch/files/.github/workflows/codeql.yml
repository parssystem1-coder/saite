# تحلیل ایستای امنیتی.
#
# ── چرا جدا از ci.yml؟ ────────────────────────────────────────
# CodeQL چند دقیقه طول می‌کشد. اگر داخل CI اصلی بود، هر push یک
# انتظار اضافه می‌داشت و آدم‌ها شروع می‌کردند به دور زدنش.
#
# اینجا روی push به main، روی PR و هفته‌ای یک‌بار اجرا می‌شود.
# اجرای زمان‌بندی‌شده مهم است: آسیب‌پذیری جدید ممکن است در کدی
# کشف شود که ماه‌هاست دست نخورده.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: تحلیل
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # مجموعهٔ گسترده‌تر: کیفیت کد + امنیت
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
