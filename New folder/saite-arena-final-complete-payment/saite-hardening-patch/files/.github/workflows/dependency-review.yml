# بررسی وابستگی‌های اضافه‌شده در هر PR.
#
# جلوی این سناریو را می‌گیرد: کسی برای یک قابلیت کوچک پکیجی اضافه
# می‌کند که آسیب‌پذیری شناخته‌شده دارد. Dependabot این را فقط
# **بعد از** merge می‌فهمد؛ این workflow قبلش.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # moderate به بالا PR را قرمز می‌کند
          fail-on-severity: moderate
          comment-summary-in-pr: always
